server {
    listen 9000;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    # nginx's default mime.types has no ttf entry.
    types {
        font/ttf ttf;
    }

    # Gzip text and binary assets
    gzip on;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/wasm font/ttf;

    # SPA fallback — unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressively cache content-hashed assets emitted by Vite
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
